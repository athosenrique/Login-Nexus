<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface de login do Nexus</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="login-container">

    <div class="login-header">

    <img src="img/logo-nexus.png" alt="Nexus Logo" width="200">

    <h1>Bem-vindo ao Nexus</h1>

    </div>

    <form action="" method="get">

        <div class="login-fields">

            <label for="email">E-mail</label>
            <input type="text" id="email" name="email" placeholder="Insira o e-mail">

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Insira sua senha">

            <a href="#">Esqueceu sua senha?</a>

        </div>

        <input class="login-button" type="submit" value="Fazer login">

        <span class="login-divider">OU</span>


        <div class="social-login">

        <button type="button">
            <img src="img/google.svg" alt="Google" width="20">
            Continuar com o Google
        </button>

         <button type="button">
            <img src="img/github.svg" alt="GitHub" width="20">
            Continuar com o GitHub
        </button>

        </div>

        <p>Não possui uma conta? <a href="#">Criar conta</a></p>

    </form>

    </div>

</body>
</html>
